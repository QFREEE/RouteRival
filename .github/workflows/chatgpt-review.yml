name: ChatGPT PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  code_review_job:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    name: ChatGPT Code Review
    steps:
      - name: GenAI Code Review
        uses: cirolini/genai-code-review@v2
        with:
          openai_api_key: ${{ secrets.openai_api_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.number }}
          openai_model: "gpt-4o-mini"
          openai_temperature: 0.2
          openai_max_tokens: 2048
          mode: patch
          language: en
          custom_prompt: "Review this PR patch for correctness, security issues, performance risks, and readability regressions. Keep comments concise and actionable."
